<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 Page Not Found - IAIGEO</title>
  <meta name="robots" content="noindex, follow">
  
  <!-- 3秒后前端自动跳转至主页 -->
  <meta http-equiv="refresh" content="3;url=https://www.iaigeo.com/">

  <style>
    :root {
      --bg-color: #0b0f17;
      --card-bg: rgba(18, 26, 41, 0.7);
      --border-color: rgba(56, 189, 248, 0.15);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent-color: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.35);
      --font-mono: 'JetBrains Mono', 'Fira Code', 'Roboto Mono', Monaco, Consolas, monospace;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: hidden;
      position: relative;
    }

    /* 网格背景波纹效果 */
    .bg-grid {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      z-index: 1;
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 2;
      max-width: 520px;
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 12px;
      padding: 40px 32px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 30px var(--accent-glow);
    }

    .brand {
      font-family: var(--font-mono);
      font-size: 13px;
      letter-spacing: 2px;
      color: var(--accent-color);
      text-transform: uppercase;
      margin-bottom: 20px;
      display: inline-block;
      padding: 4px 12px;
      background: rgba(56, 189, 248, 0.08);
      border: 1px solid rgba(56, 189, 248, 0.2);
      border-radius: 20px;
    }

    .code {
      font-family: var(--font-mono);
      font-size: 72px;
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(135deg, #ffffff 0%, var(--accent-color) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
      letter-spacing: -2px;
    }

    .title {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 12px;
      color: var(--text-main);
    }

    .description {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .timer-text {
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--accent-color);
      margin-bottom: 24px;
    }

    .actions {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 24px;
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
      border-radius: 6px;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .btn-primary {
      background-color: var(--accent-color);
      color: #0b0f17;
      border: 1px solid var(--accent-color);
      box-shadow: 0 0 15px var(--accent-glow);
    }

    .btn-primary:hover {
      background-color: #7dd3fc;
      border-color: #7dd3fc;
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: transparent;
      color: var(--text-main);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<body>
  <div class="bg-grid"></div>

  <main class="container">
    <div class="brand">WWW.IAIGEO.COM</div>
    <div class="code">404</div>
    <h1 class="title">页面未找到 / Page Not Found</h1>
    <p class="description">
      您请求的资源不存在或已被转移。系统将在 <span id="countdown">3</span> 秒后自动跳转至主页。
    </p>

    <div class="actions">
      <a href="https://www.iaigeo.com/" class="btn btn-primary">立即跳转主页</a>
      <a href="javascript:history.back()" class="btn btn-secondary">返回上一页</a>
    </div>
  </main>

  <script>
    // 动态倒计时逻辑
    let seconds = 3;
    const countdownEl = document.getElementById('countdown');
    const targetUrl = "https://www.iaigeo.com/";

    const interval = setInterval(() => {
      seconds--;
      if (countdownEl) countdownEl.textContent = seconds;
      if (seconds <= 0) {
        clearInterval(interval);
        window.location.href = targetUrl;
      }
    }, 1000);
  </script>
</body>
</html>
