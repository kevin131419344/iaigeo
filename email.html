<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IAIGEO Engine — GEO Audit & Analytics</title>
    <style>
        :root {
            --bg-color: #0A0A0C;
            --card-bg: #141419;
            --accent-color: #3B82F6;
            --text-main: #F3F4F6;
            --text-muted: #9CA3AF;
            --border-color: #27272A;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 800px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
            letter-spacing: -0.02em;
        }

        .header p {
            color: var(--text-muted);
            font-size: 1rem;
        }

        /* KPI Dashboard Grid */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .kpi-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            text-align: center;
        }

        .kpi-value {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--accent-color);
            margin-bottom: 6px;
        }

        .kpi-label {
            font-size: 0.875rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Audit Form */
        .form-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 32px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
        }

        .form-group input:focus {
            border-color: var(--accent-color);
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background-color: var(--accent-color);
            color: #FFF;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .submit-btn:hover {
            opacity: 0.9;
        }

        .submit-btn:disabled {
            background-color: #4B5563;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 头部标题 -->
    <div class="header">
        <h1>Generative Engine Optimization Audit</h1>
        <p>Analyze your website visibility across AI Answer Engines (Perplexity, SearchGPT, Gemini)</p>
    </div>

    <!-- KPI 视觉数据面板 -->
    <div class="kpi-grid">
        <div class="kpi-card">
            <div class="kpi-value">52+</div>
            <div class="kpi-label">Audit Factors</div>
        </div>
        <div class="kpi-card">
            <div class="kpi-value">&lt; 12h</div>
            <div class="kpi-label">Avg. Delivery Time</div>
        </div>
        <div class="kpi-card">
            <div class="kpi-value">99.4%</div>
            <div class="kpi-label">Citation Accuracy</div>
        </div>
    </div>

    <!-- 表单区域 -->
    <div class="form-card">
        <form id="auditForm">
            <div class="form-group">
                <label for="urlInput">TARGET WEBSITE URL</label>
                <input type="url" id="urlInput" placeholder="https://example.com" required />
            </div>
            <div class="form-group">
                <label for="emailInput">WORK EMAIL (FOR REPORT DELIVERY)</label>
                <input type="email" id="emailInput" placeholder="name@company.com" required />
            </div>
            <button type="submit" id="submitBtn" class="submit-btn">Run Free GEO Audit</button>
        </form>
    </div>
</div>

<!-- 提交逻辑 JavaScript -->
<script>
    document.getElementById('auditForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const btn = document.getElementById('submitBtn');
        const originalText = btn.innerText;
        btn.innerText = 'PROCESSING...';
        btn.disabled = true;

        const payload = {
            url: document.getElementById('urlInput').value,
            email: document.getElementById('emailInput').value
        };

        try {
            // 请求后端 Serverless API
            const response = await fetch('/api/send-audit', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (response.ok) {
                alert('Success! Audit request queued. Confirmation sent to ' + payload.email);
                document.getElementById('auditForm').reset();
            } else {
                const data = await response.json();
                alert('Submission failed: ' + (data.error || 'Unknown error'));
            }
        } catch (err) {
            alert('Network error. Please try again later.');
        } finally {
            btn.innerText = originalText;
            btn.disabled = false;
        }
    });
</script>

</body>
</html>
